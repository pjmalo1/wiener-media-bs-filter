html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Calibri,Arial,sans-serif;-webkit-text-size-adjust:100%}

.logo{width:40px;height:40px;border-radius:50%;border:2px solid var(--amber);display:grid;place-items:center;flex:none}

h1{font:700 21px/1.15 Cambria,Georgia,serif;margin:0}
.tag{font:italic 13px Georgia,serif;color:#c9d2f2}
.spacer{flex:1}
#refresh{background:var(--amber);color:#1b1b1b;border:0;border-radius:20px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
#refresh:disabled{opacity:.6;cursor:wait}
.status{max-width:1100px;margin:6px auto 0;font-size:12.5px;color:#c9d2f2;display:flex;gap:10px;flex-wrap:wrap}
nav{display:flex;gap:6px;max-width:1100px;margin:10px auto 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav button{flex:none;background:transparent;color:#dfe5fb;border:1px solid #3d4f99;border-radius:18px;padding:6px 12px;font-size:13.5px;cursor:pointer}
nav button.on{background:#fff;color:var(--navy);border-color:#fff;font-weight:700}
main{max-width:1100px;margin:0 auto;padding:14px 12px 40px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}

.chips button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 12px;font-size:13px;color:var(--grey)}
.ctl>span:first-child{font-weight:700;color:var(--ink)}
.ctl button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.ctl button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
details.roll{border-top:1px solid #eef0f5}
details.roll>summary{cursor:pointer;padding:9px 14px;color:var(--navy2);font-size:13.5px;font-weight:600;list-style:none}
details.roll>summary::-webkit-details-marker{display:none}
details.roll[open]>summary{background:#f7f8fb}
details.roll .src{background:#fbfbfd}
.mode{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 14px;overflow:hidden}
.mhead{padding:10px 14px;background:linear-gradient(90deg,#e7f4f4,#fff);border-bottom:1px solid var(--line)}
.mhead h2{margin:0;font:700 17px Cambria,Georgia,serif;color:var(--teal)}
.mmeta{font-size:12.5px;color:var(--grey);margin-top:2px}
.src{padding:10px 14px;border-top:1px solid #eef0f5}
.src:first-of-type{border-top:0}
.sline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sname{font-weight:700}
.pill{font-size:11.5px;border-radius:10px;padding:1px 7px;background:#eef1f8;color:var(--navy2);white-space:nowrap}
.pill.snr{background:#e3f2e5;color:var(--green)}
.pill.pri{background:var(--teal);color:#fff}
.pill.x{background:#fff3e0;color:var(--orange)}
.pill.L{background:#e8effc;color:#2a5bc4}.pill.R{background:#fdeaea;color:var(--red)}.pill.C{background:#eee;color:#444}
ul.h{margin:5px 0 0;padding:0;list-style:none}
ul.h li{margin:4px 0;padding-left:12px;position:relative}
ul.h li:before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--teal)}
.age{color:var(--grey);font-size:12px;white-space:nowrap}
.empty{color:var(--grey);font-style:italic;padding:12px 14px}
.nosig b{font-style:normal;color:var(--navy);letter-spacing:.04em;margin-right:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:10px;padding:11px 13px}
.card.prop{border-left-color:var(--red)}
.card h3{margin:0 0 4px;font-size:16px}
.bars{display:grid;grid-template-columns:62px 1fr 52px;gap:4px 8px;align-items:center;font-size:12.5px;margin:6px 0}
.bar{height:8px;background:#eef0f5;border-radius:4px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:4px}
.intro{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.intro h2{margin:0 0 4px;font:700 18px Cambria,Georgia,serif;color:var(--navy)}
.intro p{margin:4px 0;color:#333}
table{border-collapse:collapse;width:100%;background:#fff;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--navy);color:#fff;position:sticky;top:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.foot{font-size:12px;color:var(--grey);margin-top:16px}
.warn{background:#fff8e6;border:1px solid #f3d38a;color:#6b4e00;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13.5px}
@media (max-width:600px){h1{font-size:18px}.tag{display:none}#refresh{padding:8px 12px}.bars{grid-template-columns:54px 1fr 46px}}

  if (ok){
    const items = Object.assign({}, DATA.items, got);
    DATA = { at: Date.now(), items, live:true, ok, total: live.length };
    try { localStorage.setItem("wbsf-cache", JSON.stringify(DATA)); } catch(e) {}
  } else { DATA.failed = true; }
  btn.disabled=false; btn.textContent="↻ Refresh";
  render();
}
function pill(cls, txt){ return `<span class="pill ${cls}">${esc(txt)}</span>`; }
function srcPills(s){ return pill("snr",(s.snr>=0?"+":"")+s.snr.toFixed(1)+" dB") + pill(s.dir, Math.round(s.drift)+"% "+({L:"left",R:"right",C:"center"})[s.dir]) + pill("", "score "+Math.round(s.fom)); }
function stamp(){
  const n = Object.keys(DATA.items||{}).length;
  let msg;
  if (!DATA.at) msg = "No headlines yet — tap Refresh.";
  else if (DATA.live) msg = `Live headlines, received ${new Date(DATA.at).toLocaleString([], {dateStyle:"medium", timeStyle:"short"})}`;
  else msg = `Saved headlines from ${new Date(DATA.at).toLocaleString([], {dateStyle:"medium", timeStyle:"short"})}`;
  $("#stamp").textContent = msg + (DATA.failed && !SANDBOXED ? " · live update failed, showing the last good set" : "");
  $("#count").textContent = `${n}/${SOURCES.filter(s=>s.cls==="signal").length} high-SNR sources reporting · ${SOURCES.filter(s=>s.cls!=="signal").length} filtered out`;
}
function rowHTML(s, its, m){
  const role = m && m.primary.includes(s.name) ? pill("pri","primary") : m && m.cross.includes(s.name) ? pill("x","cross-check") : "";
  return `<div class="src"><div class="sline"><span class="sname">${esc(s.name)}</span>${role}${srcPills(s)}</div><ul class="h">` +
    its.map(i=>`<li><a href="${esc(i.l)}" target="_blank" rel="noopener">${esc(i.t)}</a> <span class="age">${ago(i.d)}</span></li>`).join("") + `</ul></div>`;
}
function section(title, meta, matches){            // matches: [{s, i}] already in SNR order
  const top = [], rest = [], seenSrc = new Set();
  for (const x of matches){
    if (top.length < MAXN && x.s.snr >= THRESH && !seenSrc.has(x.s.name) && (!x.i.d || Date.now()-x.i.d < 36*36e5)){ top.push(x); seenSrc.add(x.s.name); }
    else rest.push(x);
  }
  let body = top.map(x=>rowHTML(x.s,[x.i],x.m)).join("");
  if (!body) body = `<div class="empty nosig"><b>No Signal</b> — nothing in this mode at or above ${fmtTh()} right now. Pick a lower Min SNR to see more.</div>`;
  if (rest.length){
    const bySrc = new Map(); for (const x of rest){ if(!bySrc.has(x.s.name)) bySrc.set(x.s.name,{s:x.s,m:x.m,its:[]}); bySrc.get(x.s.name).its.push(x.i); }
    const names = [...bySrc.values()].map(v=>v.s.name.replace(/ \(web\)/,""));
    body += `<details class="roll"><summary>+ ${rest.length} more from ${names.length} source${names.length>1?"s":""} <span class="age">(${esc(names.slice(0,4).join(", "))}${names.length>4?", …":""})</span></summary>` +
            [...bySrc.values()].map(v=>rowHTML(v.s,v.its.slice(0,3),v.m)).join("") + `</details>`;
  }
  return `<section class="mode"><div class="mhead"><h2>${esc(title)}</h2><div class="mmeta">${meta}</div></div>${body}</section>`;
}
function fmtTh(){ return (THRESH>0?"+":"")+THRESH+" dB"; }
function viewSignal(){
  const sig = SOURCES.filter(s=>s.cls==="signal").sort((a,b)=>b.snr-a.snr);
  let h = `<div class="chips">` + [{id:"all",name:"All modes"}].concat(MODES).map(m=>`<button data-m="${m.id}" class="${MODE===m.id?"on":""}">${esc(m.name.split(",")[0])}</button>`).join("") + `</div>`;
  h += `<div class="ctl"><span>Min SNR</span>` + [0,1,2,3].map(v=>`<button data-th="${v}" class="${THRESH===v?"on":""}">${v>0?"+":""}${v} dB</button>`).join("") +
       `<span class="age">${sig.filter(s=>s.snr>=THRESH).length} of ${sig.length} sources · top ${MAXN} per mode</span></div>`;
  if (DATA.failed && SANDBOXED) h += `<div class="warn">You’re viewing a preview (for example inside OneDrive) that blocks live updates, so these are the headlines saved ${DATA.at?ago(DATA.at):"earlier"}. For live headlines and a working Refresh button, download this file and open it in Chrome, Edge or Safari on a computer.</div>`;
  else if (DATA.failed && !Object.keys(DATA.items||{}).length) h += `<div class="warn">Couldn’t reach the headline relay right now. Try Refresh in a minute.</div>`;
  const used = new Set();
  for (const m of MODES){
    if (MODE!=="all" && MODE!==m.id) continue;
    const matches = [];
    for (const s of sig) for (const i of (DATA.items[s.name]||[])) if (m.kw.test(i.t) && !used.has(i.l)) matches.push({s,i,m});
    const sec = section(m.name, `Seeker mode: ${esc(m.seeker)} · Primary: ${esc(m.primary.join(", "))} · Cross-check: ${esc(m.cross.join(", "))} · Fail-safe: ${esc(m.fail)}`, matches);
    if (MODE==="all") { const seen=new Set(); for (const x of matches) if (x.s.snr>=THRESH && !seen.has(x.s.name) && seen.size<MAXN && (!x.i.d || Date.now()-x.i.d < 36*36e5)){ seen.add(x.s.name); used.add(x.i.l); } }
    h += sec;
  }
  if (MODE==="all"){
    const matches = [];
    for (const s of sig) for (const i of (DATA.items[s.name]||[])) if (!used.has(i.l) && !MODES.some(m=>m.kw.test(i.t))) matches.push({s,i});
    if (matches.length) h += section("Other top stories", "Headlines that fit no mode above, ordered by SNR.", matches);
  }
  return h;
}
function bars(s){
  const snrW = Math.max(0, Math.min(100, (s.snr+8)/13*100)), dW = Math.min(100, s.drift);
  return `<div class="bars"><span>SNR</span><div class="bar"><i style="left:0;width:${snrW}%;background:${s.snr>=0?"var(--green)":"var(--orange)"}"></i></div><b>${(s.snr>=0?"+":"")+s.snr.toFixed(1)} dB</b>
  <span>Drift</span><div class="bar"><i style="left:0;width:${dW}%;background:${s.dir==="L"?"#2a5bc4":s.dir==="R"?"var(--red)":"#888"}"></i></div><b>${Math.round(s.drift)}% ${s.dir}</b></div>`;
}
function viewList(cls){
  const L = SOURCES.filter(s=>s.cls===cls).sort((a,b)=>b.snr-a.snr);
  const intro = cls==="noise"
    ? `<div class="intro"><h2>BS list: noise</h2><p>Sources whose published reliability puts them below 0 dB, meaning more noise than signal, but whose drift is under 40%. In Wiener’s terms this is mostly <b>uncorrelated noise</b>: errors and opinion that don’t all point the same way, so averaging several sources reduces it. The filter mutes them by default. Read one only as a cross-check, never as a first source.</p></div>`
    : `<div class="intro"><h2>Propaganda list: coherent false signal</h2><p>Sources below 0 dB <b>and</b> with drift of 40% or more. Their error is <b>correlated</b>: it points steadily in one direction, like a jammer transmitting a convincing false target. Averaging doesn’t remove a coherent bias, so the filter rejects these and, like a seeker’s home-on-jam mode, notes who is broadcasting. This is a measurement category, not a judgment of motives.</p></div>`;
  return intro + `<div class="cards">` + L.map(s=>`<div class="card ${cls==="propaganda"?"prop":""}"><h3>${esc(s.name)}${s.est?" *":""}</h3>
    <div class="sline">${pill("", s.group==="mainstream"?"mainstream":"independent")}${pill("", "score "+Math.round(s.fom))}</div>${bars(s)}
    <div style="font-size:13.5px">${esc(s.note)}</div><div style="font-size:12.5px;margin-top:6px"><a href="${esc(s.home)}" target="_blank" rel="noopener">Source site ↗</a></div></div>`).join("") + `</div>` +
    (L.some(s=>s.est) ? `<p class="foot">* No Ad Fontes score. Its Media Bias/Fact Check rating (Extreme Right, Low factual reporting) is mapped onto Ad Fontes’ scale as bias +27, reliability 20, calibrated on War Room, which both services rate.</p>` : "");
}
function viewAll(){
  const L = SOURCES.slice().sort((a,b)=>b.snr-a.snr);
  const lab = {signal:"✓ signal", noise:"noise", propaganda:"propaganda"};
  return `<div class="intro"><h2>All sources, ranked by SNR</h2><p>SNR and drift come from Ad Fontes Media’s published reliability and bias scores (Nov. 2026). Relevance and scope are the author’s assessment. Filter score = 70% published ratings + 30% assessment.</p></div>
  <div class="tw"><table><thead><tr><th>Source</th><th>Filter</th><th>SNR</th><th>Drift</th><th>Score</th><th>What to know</th></tr></thead><tbody>` +
  L.map(s=>`<tr><td><b>${esc(s.name)}${s.est?" *":""}</b><br><span class="age">${s.group}</span></td><td style="color:${s.cls==="signal"?"var(--green)":s.cls==="noise"?"var(--orange)":"var(--red)"};font-weight:700">${lab[s.cls]}</td><td>${(s.snr>=0?"+":"")+s.snr.toFixed(1)}</td><td>${Math.round(s.drift)}% ${s.dir}</td><td>${Math.round(s.fom)}</td><td>${esc(s.note)}</td></tr>`).join("") + `</tbody></table></div>`;
}
function viewMethod(){
  return `<div class="intro"><h2>How the filter works</h2>
  <p><b>Signal-to-noise ratio.</b> SNR (dB) = 10·log<sub>10</sub>(R / (64 − R)), where R is Ad Fontes Media’s 0–64 reliability score. R = 32 gives 0 dB; above it there is more signal than noise.</p>
  <p><b>Drift</b> = |bias| / 42, as a percentage, the way a seeker measures boresight error. L or R gives the direction.</p>
  <p><b>Three classes.</b> Signal: SNR ≥ 0 dB (headlines shown). Noise: SNR &lt; 0 dB and drift &lt; 40% (muted). Propaganda, a coherent false signal: SNR &lt; 0 dB and drift ≥ 40% (rejected).</p>
  <p><b>Modes.</b> As a missile seeker changes modes with the scene, the filter sorts live headlines into seven subject modes by keyword. Within each mode, the three strongest headlines from the last 36 hours are shown, one per source, from sources at or above the Min SNR setting (default +2 dB); everything else is rolled up behind a “more” line you can open. Each mode’s primary and cross-check sources are marked. Cross-checks are chosen so their drifts point in opposite directions and largely cancel.</p>
  <p><b>Live updates.</b> Each time the page opens, and whenever you tap Refresh, it pulls the newest headlines from each high-SNR source’s public feed through a free relay (rss2json.com). No AI is involved: headlines appear exactly as each outlet wrote them. If the relay can’t be reached, the last good set is shown with its time.</p>
  <p><b>Norbert Wiener.</b> His 1942 filter, published in 1949, estimates a signal by weighting inputs according to their noise. In <i>Cybernetics</i> (1948) he called control of the means of communication the most important force working against a society’s ability to correct itself.</p>
  <p><b>Watch: what a missile seeker is and how it works.</b></p>
  <ul class="h" style="margin-bottom:8px">
   <li><a href="https://www.youtube.com/watch?v=4QtD_nwMpQ8" target="_blank" rel="noopener">Inside the Infrared Seeker: How Missiles See Their Targets</a> <span class="age">Sciborg</span></li>
   <li><a href="https://www.youtube.com/watch?v=axPJcdvJxLs" target="_blank" rel="noopener">AIM-9 Sidewinder Infrared Seeker, in one minute</a> <span class="age">Military History in a Minute</span></li>
   <li><a href="https://www.youtube.com/watch?v=KBMU6l6GsdM" target="_blank" rel="noopener">Lockheed Martin Multiple Kill Vehicle (MKV-L) hover test, Dec. 2, 2008</a> <span class="age">Missile Defense Agency footage: the vehicle hovers and tracks a surrogate target</span></li>
  </ul>
  <p class="foot">Ratings: Ad Fontes Media source pages (retrieved November 2026); Media Bias/Fact Check for Promethean Updates. A rating is a measurement of published content, not a verdict on any person’s motives. Built for “An Auto-Ranging Media BS Filter” by Peter Maloney.</p></div>`;
}
function render(){
  stamp();
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.v===VIEW));
  const v = {signal:viewSignal, noise:()=>viewList("noise"), prop:()=>viewList("propaganda"), all:viewAll, method:viewMethod}[VIEW] || viewSignal;
  $("#main").innerHTML = v();
  document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{ MODE=b.dataset.m; render(); });
  document.querySelectorAll(".ctl button").forEach(b=>b.onclick=()=>{ THRESH=+b.dataset.th; try{localStorage.setItem("wbsf-th3",THRESH)}catch(e){} render(); });
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{ VIEW=b.dataset.v; try{localStorage.setItem("wbsf-view",VIEW)}catch(e){} window.scrollTo(0,0); render(); });
$("#refresh").onclick = refresh;
render();
refresh();
</script>
</body>
</html>
